<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>喵站工作台 - 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5;font-family:-apple-system,sans-serif}
.card{background:white;border-radius:12px;padding:40px 32px;width:360px;max-width:90vw;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center}
h1{font-size:24px;font-weight:700;margin-bottom:8px;color:#1a1a1a}
p{font-size:14px;color:#666;margin-bottom:28px}
input{width:100%;padding:10px 14px;border:1px solid #d9d9d9;border-radius:10px;font-size:15px;text-align:center;outline:none}
input:focus{border-color:#6c5ce7}
.err{color:#e74c3c;font-size:12px;margin-top:8px;min-height:20px}
button{width:100%;margin-top:14px;padding:10px;background:#6c5ce7;color:white;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:#5b4bd5}
button:disabled{background:#b2a3f2;cursor:not-allowed}
.tip{font-size:11px;color:#aaa;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<h1>喵站工作台</h1>
<p>请输入管理员密码</p>
<form id="loginForm" onsubmit="handleSubmit(event)">
<input type="password" id="password" placeholder="密码" autofocus required>
<div class="err" id="error"></div>
<button type="submit" id="submitBtn">登录</button>
</form>
<p class="tip">无 React 依赖，秒开即用</p>
</div>
<script>
async function handleSubmit(e){
  e.preventDefault();
  var btn=document.getElementById('submitBtn');
  var err=document.getElementById('error');
  var pw=document.getElementById('password').value;
  btn.disabled=true;
  btn.textContent='登录中...';
  err.textContent='';
  try{
    var r=await fetch('/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'password='+encodeURIComponent(pw)
    });
    var d=await r.json();
    if(d.success){
      window.location.href=d.redirect||'/';
    }else{
      err.textContent=d.error||'密码错误';
      btn.disabled=false;
      btn.textContent='登录';
    }
  }catch(ex){
    err.textContent='网络错误，请重试';
    btn.disabled=false;
    btn.textContent='登录';
  }
}
</script>
</body>
</html>
